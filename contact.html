<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Продаю аккаунт</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>    
    <video autoplay loop muted playsinline id="bg-video">
        <source src="img/backgroundmig.webm" type="video/webm">
    </video>
    
    <header>
        <nav>
            <ul>
                <li><a href="index.html">Главная</a></li>
                <li><a href="vehicles.html">Техника</a></li>
                <li><a href="screens.html">Бонус</a></li>
                <li><a href="#">Связь</a></li>
            </ul>
        </nav>
    </header>

    <main class="main-wrapper" style="display: block;">
        
        <h1 class="section-title">Связаться с продавцом</h1>
        
        <div class="widget" style="max-width: 600px; margin: 20px auto;">
            <form action="#" method="POST">
                <div style="margin-bottom: 15px;">
                    <label style="display: block; color: #ccc; margin-bottom: 5px;">Ваше имя:</label>
                    <input type="text" placeholder="Иван" style="width: 100%; padding: 10px; background: #1a1a1a; border: 1px solid #3a3f45; color: white; border-radius: 4px;">
                </div>
                <div style="margin-bottom: 15px;">
                    <label style="display: block; color: #ccc; margin-bottom: 5px;">Telegram или Discord:</label>
                    <input type="text" placeholder="@nickname" style="width: 100%; padding: 10px; background: #1a1a1a; border: 1px solid #3a3f45; color: white; border-radius: 4px;">
                </div>
                <div style="margin-bottom: 20px;">
                    <label style="display: block; color: #ccc; margin-bottom: 5px;">Сообщение:</label>
                    <textarea rows="4" placeholder="У меня есть вопросы..." style="width: 100%; padding: 10px; background: #1a1a1a; border: 1px solid #3a3f45; color: white; border-radius: 4px; resize: vertical;"></textarea>
                </div>
                
                <button type="button" onclick="alert('Сообщение отправлено! (На самом деле нет, это учебный сайт поэтому пишите в тг/дс)')" style="width: 100%; padding: 15px; background: #e6b31e; color: #1a1a1a; border: none; border-radius: 4px; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.3s;">
                    Отправить сообщение
                </button>
            </form>
        </div>

        <div class="widget" style="max-width: 600px; margin: 20px auto; text-align: center;">
            <p>Мой Telegram: <strong>@rbtinsd</strong></p>
            <p>Мой Discord: <strong>rbtinsd</strong></p>
            <p style="font-size: 12px; color: #666; margin-top: 10px;">Сделка проходит только через Funpay. Безопасность превыше всего.</p>
        </div>

    </main>
</body>
</html>
